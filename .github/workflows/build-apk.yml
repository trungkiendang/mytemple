name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Patch pub cache for AGP 9.0 compatibility
        run: |
          # flutter_haptic v0.0.3
          F="$HOME/.pub-cache/hosted/pub.dev/flutter_haptic-0.0.3/android/build.gradle"
          if [ -f "$F" ]; then
            python3 -c "open('$F','w').write('''group \"studio.creche.flutter_haptic\"\nversion \"1.0-SNAPSHOT\"\napply plugin: \"com.android.library\"\napply plugin: \"kotlin-android\"\nandroid {\n  compileSdkVersion 35\n  namespace \"studio.creche.flutter_haptic\"\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = JavaVersion.VERSION_17.toString()\n  }\n  sourceSets {\n    main.java.srcDirs += \"src/main/kotlin\"\n  }\n  defaultConfig {\n    minSdkVersion 23\n  }\n}\ndependencies {\n  implementation \"org.jetbrains.kotlin:kotlin-stdlib-jdk7\"\n}''')"
            echo "Patched flutter_haptic"
          fi
          # device_info v2.0.3
          F="$HOME/.pub-cache/hosted/pub.dev/device_info-2.0.3/android/build.gradle"
          if [ -f "$F" ]; then
            python3 -c "open('$F','w').write('''group \"io.flutter.plugins.deviceinfo\"\nversion \"1.0-SNAPSHOT\"\napply plugin: \"com.android.library\"\nandroid {\n  compileSdk 35\n  namespace \"io.flutter.plugins.deviceinfo\"\n  defaultConfig {\n    minSdkVersion 16\n  }\n}''')"
            echo "Patched device_info"
          fi

      - name: Build APK
        id: build
        run: |
          flutter build apk --release 2>&1 | tee build.log; exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Print error from log
        if: failure()
        run: |
          ERROR=$(tail -50 build.log 2>/dev/null || echo "No build.log")
          echo "::error title=Build Error::$(echo "$ERROR" | tr '\n' ';' | head -c 2000)"

      - name: Rename APK with version
        if: success()
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          APP_NAME=$(grep '^name: ' pubspec.yaml | sed 's/name: //')
          APK=$(find build -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found!" >&2
            exit 1
          fi
          mv "$APK" "${APP_NAME}-v${VERSION}-release.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: "*.apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
