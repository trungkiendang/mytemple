name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Generate keystore for signing
        run: |
          KEYSTORE_PASS="${KEYSTORE_PASS:-temple123}"
          KEY_PASS="${KEY_PASS:-temple123}"
          KEY_ALIAS="${KEY_ALIAS:-temple_vibe}"
          keytool -genkey -v \
            -keystore android/app/temple_vibe.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Trung Kien Dang, OU=Development, O=Temple Vibe, L=HCMC, ST=Vietnam, C=VN"
          echo "storePassword=$KEYSTORE_PASS" > android/key.properties
          echo "keyPassword=$KEY_PASS" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=temple_vibe.keystore" >> android/key.properties

      - run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          APP_NAME=$(grep '^name: ' pubspec.yaml | sed 's/name: //')
          mv build/app/outputs/flutter-apk/app-release.apk \
             "${APP_NAME}-v${VERSION}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "*.apk"
