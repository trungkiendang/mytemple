name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build APK
        id: build
        run: |
          flutter build apk --release 2>&1 | tee build.log; exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit $exit_code

      - name: Print error from log
        if: failure()
        run: |
          ERROR=$(tail -50 build.log 2>/dev/null || echo "No build.log")
          echo "::error title=Build Error::$(echo "$ERROR" | tr '\n' ';' | head -c 2000)"

      - name: Rename APK with version
        if: success()
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          APP_NAME=$(grep '^name: ' pubspec.yaml | sed 's/name: //')
          APK=$(find build -name "app-release.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found!" >&2
            exit 1
          fi
          mv "$APK" "${APP_NAME}-v${VERSION}-release.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-apk
          path: "*.apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
