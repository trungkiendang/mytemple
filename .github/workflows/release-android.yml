name: Release Android (Google Play)

# Builds a signed App Bundle and uploads it to Google Play.
# Run manually (Actions → Run workflow) or push a tag like v1.2.0.
# Secrets/variables: see docs/STORE_PUBLISHING.md

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: 'Release status (use draft until the app is published for the first time)'
        type: choice
        default: draft
        options: [draft, completed]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!v}" ]; then echo "::error title=Missing secret::$v is not set (see docs/STORE_PUBLISHING.md)"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      - run: flutter pub get

      - name: Patch pub cache for AGP 9.0 compatibility
        run: |
          F="$HOME/.pub-cache/hosted/pub.dev/flutter_haptic-0.0.3/android/build.gradle"
          if [ -f "$F" ]; then
            python3 -c "open('$F','w').write('''group \"studio.creche.flutter_haptic\"\nversion \"1.0-SNAPSHOT\"\napply plugin: \"com.android.library\"\napply plugin: \"kotlin-android\"\nandroid {\n  compileSdkVersion 35\n  namespace \"studio.creche.flutter_haptic\"\n  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_17\n    targetCompatibility JavaVersion.VERSION_17\n  }\n  kotlinOptions {\n    jvmTarget = JavaVersion.VERSION_17.toString()\n  }\n  sourceSets {\n    main.java.srcDirs += \"src/main/kotlin\"\n  }\n  defaultConfig {\n    minSdkVersion 23\n  }\n}\ndependencies {\n  implementation \"org.jetbrains.kotlin:kotlin-stdlib-jdk7\"\n}''')"
          fi

      - name: Restore upload keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kun.temple
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || vars.PLAY_DEFAULT_TRACK || 'internal' }}
          status: ${{ github.event.inputs.status || vars.PLAY_RELEASE_STATUS || 'draft' }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
